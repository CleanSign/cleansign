version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "daily"
  - package-ecosystem: "gomod"
    directory: "/server"
    schedule:
      interval: "daily"
  - package-ecosystem: "uv"
    directory: "/ai-service"
    schedule:
      interval: "daily"
  - package-ecosystem: "docker"
    directories:
      - "/web"
      - "/server"
      - "/ai-service"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
