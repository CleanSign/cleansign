[project]
name = "cleansign-ai"
version = "0.1.0"
description = "Clean Sign 계약서 분석 AI 서버"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pypdf>=5.0",
  "python-multipart>=0.0.9",
  "rapidocr>=3.9.2",
  "onnxruntime>=1.30.0",
  "pypdfium2>=5.14.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "reportlab>=4.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
